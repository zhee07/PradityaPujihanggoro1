<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biodata Praditya Pujihanggoro</title>

    <!-- Bootstrap CDN -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                Biodata Mahasiswa
            </span>
        </div>
    </nav>

    <!-- Biodata -->
    <div class="container py-5">
        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow border-0">

                    <!-- Header -->
                    <div class="card-header bg-primary text-white text-center py-4">
                        <h2 class="mb-1">Biodata Saya</h2>
                        <p class="mb-0">Mahasiswa Semester 1</p>
                    </div>

                    <!-- Isi Biodata -->
                    <div class="card-body p-4">

                        <div class="text-center mb-4">
                            <div 
                                class="rounded-circle bg-primary text-white 
                                       d-flex align-items-center justify-content-center 
                                       mx-auto"
                                style="width: 100px; height: 100px; font-size: 40px;"
                            >
                                P
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-5 fw-bold">Nama</div>
                            <div class="col-7">Praditya Pujihanggoro</div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-5 fw-bold">Kelas</div>
                            <div class="col-7">Komputerisasi Akuntansi</div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-5 fw-bold">Semester</div>
                            <div class="col-7">1</div>
                        </div>

                        <div class="row">
                            <div class="col-5 fw-bold">Status</div>
                            <div class="col-7">
                                <span class="badge bg-success">
                                    Mahasiswa Aktif
                                </span>
                            </div>
                        </div>

                    </div>

                    <!-- Footer -->
                    <div class="card-footer text-center text-muted">
                        © 2026 Praditya Pujihanggoro
                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
